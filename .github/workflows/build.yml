name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - name: Ekstrak proyek
        run: unzip -q "$(ls *.zip | head -1)" -d proj
      - name: Perbaiki kode
        working-directory: proj
        run: |
          sed -i 's/fun setMode(/fun switchMode(/' app/src/main/java/com/example/mykeyboard/KeyboardService.kt
          sed -i 's/s\.setMode(/s.switchMode(/' app/src/main/java/com/example/mykeyboard/KeyboardUi.kt
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyKeyboard-APK
          path: proj/app/build/outputs/apk/debug/*.apk 
